<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 720" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .system-box { fill: #1e293b; stroke: #3b82f6; stroke-width: 2.5; rx: 12; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }
      .system-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #60a5fa; }
      .system-subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; }
      .actor-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #f8fafc; text-anchor: middle; }
      .usecase-ellipse { fill: #1e3a5f; stroke: #38bdf8; stroke-width: 2; rx: 110; ry: 24; }
      .usecase-ellipse-celda { fill: #312e81; stroke: #818cf8; stroke-width: 2; rx: 115; ry: 24; }
      .usecase-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
      .link-line { stroke: #94a3b8; stroke-width: 1.6; }
      .dashed-line { stroke: #eab308; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .dashed-line-pink { stroke: #ec4899; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .relation-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #eab308; font-weight: 600; text-anchor: middle; }
      .relation-label-pink { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #f472b6; font-weight: 600; text-anchor: middle; }
      .section-badge { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #38bdf8; }
      .section-badge-celda { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #a5b4fc; }
    </style>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#eab308" />
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ec4899" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Límite del Sistema -->
  <rect x="240" y="30" width="570" height="660" class="system-box" />
  <text x="525" y="62" text-anchor="middle" class="system-title">Sistema Parqueadero Autos Colombia - Iteración 2</text>
  <text x="525" y="80" text-anchor="middle" class="system-subtitle">Casos de Uso: Gestión de Usuarios y Gestión de Celdas (StarUML - UML 2.2)</text>

  <!-- SECTOR USUARIOS -->
  <rect x="255" y="95" width="540" height="275" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="6,4" rx="8" />
  <text x="270" y="115" class="section-badge">MÓDULO: GESTIÓN DE USUARIOS Y ROLES (CU-USU)</text>

  <!-- SECTOR CELDAS -->
  <rect x="255" y="385" width="540" height="290" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="6,4" rx="8" />
  <text x="270" y="405" class="section-badge-celda">MÓDULO: GESTIÓN Y REASIGNACIÓN DE CELDAS (CU-CEL)</text>

  <!-- ACTORES -->
  <!-- 1. Administrador (Izquierda Superior) -->
  <g transform="translate(110, 180)">
    <circle cx="0" cy="0" r="16" fill="#fef08a" stroke="#ca8a04" stroke-width="2.2" />
    <line x1="0" y1="16" x2="0" y2="52" stroke="#ca8a04" stroke-width="2.5" />
    <line x1="-22" y1="30" x2="22" y2="30" stroke="#ca8a04" stroke-width="2.5" />
    <line x1="0" y1="52" x2="-18" y2="92" stroke="#ca8a04" stroke-width="2.5" />
    <line x1="0" y1="52" x2="18" y2="92" stroke="#ca8a04" stroke-width="2.5" />
    <text x="0" y="112" class="actor-text">Administrador</text>
    <text x="0" y="127" class="actor-text">del Sistema</text>
  </g>

  <!-- 2. Operador de Parqueadero (Izquierda Inferior) -->
  <g transform="translate(110, 480)">
    <circle cx="0" cy="0" r="16" fill="#bae6fd" stroke="#0284c7" stroke-width="2.2" />
    <line x1="0" y1="16" x2="0" y2="52" stroke="#0284c7" stroke-width="2.5" />
    <line x1="-22" y1="30" x2="22" y2="30" stroke="#0284c7" stroke-width="2.5" />
    <line x1="0" y1="52" x2="-18" y2="92" stroke="#0284c7" stroke-width="2.5" />
    <line x1="0" y1="52" x2="18" y2="92" stroke="#0284c7" stroke-width="2.5" />
    <text x="0" y="112" class="actor-text">Operador de</text>
    <text x="0" y="127" class="actor-text">Parqueadero</text>
  </g>

  <!-- 3. Auditor / Supervisor (Derecha) -->
  <g transform="translate(930, 340)">
    <circle cx="0" cy="0" r="16" fill="#fed7aa" stroke="#ea580c" stroke-width="2.2" />
    <line x1="0" y1="16" x2="0" y2="52" stroke="#ea580c" stroke-width="2.5" />
    <line x1="-22" y1="30" x2="22" y2="30" stroke="#ea580c" stroke-width="2.5" />
    <line x1="0" y1="52" x2="-18" y2="92" stroke="#ea580c" stroke-width="2.5" />
    <line x1="0" y1="52" x2="18" y2="92" stroke="#ea580c" stroke-width="2.5" />
    <text x="0" y="112" class="actor-text">Auditor /</text>
    <text x="0" y="127" class="actor-text">Supervisor</text>
  </g>

  <!-- CASOS DE USO: USUARIOS -->
  <!-- CU-01: Autenticación -->
  <g transform="translate(390, 150)">
    <ellipse cx="0" cy="0" rx="115" ry="22" class="usecase-ellipse" />
    <text x="0" y="4" class="usecase-text">CU-USU-01: Autenticar Usuario y Control de Acceso</text>
  </g>

  <!-- CU-02: Registrar Usuario -->
  <g transform="translate(390, 220)">
    <ellipse cx="0" cy="0" rx="115" ry="22" class="usecase-ellipse" />
    <text x="0" y="4" class="usecase-text">CU-USU-02: Registrar Nuevo Usuario Operador/Admin</text>
  </g>

  <!-- CU-03: Modificar y Asignar Rol -->
  <g transform="translate(390, 290)">
    <ellipse cx="0" cy="0" rx="115" ry="22" class="usecase-ellipse" />
    <text x="0" y="4" class="usecase-text">CU-USU-03: Modificar Datos y Asignar Rol</text>
  </g>

  <!-- CU-04: Activar / Inactivar -->
  <g transform="translate(670, 220)">
    <ellipse cx="0" cy="0" rx="100" ry="22" class="usecase-ellipse" />
    <text x="0" y="4" class="usecase-text">CU-USU-04: Activar / Inactivar Acceso</text>
  </g>

  <!-- CASOS DE USO: CELDAS -->
  <!-- CU-CEL-01: Parametrizar y Crear Celda -->
  <g transform="translate(390, 440)">
    <ellipse cx="0" cy="0" rx="115" ry="22" class="usecase-ellipse-celda" />
    <text x="0" y="4" class="usecase-text">CU-CEL-01: Parametrizar y Crear Nueva Celda</text>
  </g>

  <!-- CU-CEL-02: Monitorear Celdas en Tiempo Real -->
  <g transform="translate(390, 510)">
    <ellipse cx="0" cy="0" rx="115" ry="22" class="usecase-ellipse-celda" />
    <text x="0" y="4" class="usecase-text">CU-CEL-02: Monitorear Ocupación en Tiempo Real</text>
  </g>

  <!-- CU-CEL-03: Reasignar Vehículo de Celda -->
  <g transform="translate(390, 580)">
    <ellipse cx="0" cy="0" rx="115" ry="22" class="usecase-ellipse-celda" />
    <text x="0" y="4" class="usecase-text">CU-CEL-03: Reasignar Vehículo entre Celdas</text>
  </g>

  <!-- CU-CEL-04: Cambiar Estado a Mantenimiento -->
  <g transform="translate(670, 510)">
    <ellipse cx="0" cy="0" rx="105" ry="22" class="usecase-ellipse-celda" />
    <text x="0" y="4" class="usecase-text">CU-CEL-04: Inhabilitar por Mantenimiento</text>
  </g>

  <!-- CU-CEL-05: Auditoría de Historial de Celdas -->
  <g transform="translate(670, 620)">
    <ellipse cx="0" cy="0" rx="105" ry="22" class="usecase-ellipse-celda" />
    <text x="0" y="4" class="usecase-text">CU-CEL-05: Auditar Celdas y Estadías</text>
  </g>

  <!-- ENLACES DE ACTORES A CASOS DE USO -->
  <!-- Admin a CU-USU-01, 02, 03, CU-CEL-01, 02 -->
  <line x1="140" y1="200" x2="275" y2="155" class="link-line" />
  <line x1="140" y1="210" x2="275" y2="220" class="link-line" />
  <line x1="140" y1="220" x2="275" y2="285" class="link-line" />
  <line x1="140" y1="230" x2="285" y2="435" class="link-line" />

  <!-- Operador a CU-USU-01, CU-CEL-02, CU-CEL-03 -->
  <line x1="140" y1="460" x2="285" y2="160" class="link-line" />
  <line x1="140" y1="490" x2="275" y2="510" class="link-line" />
  <line x1="140" y1="510" x2="275" y2="580" class="link-line" />

  <!-- Auditor a CU-CEL-02, CU-CEL-05, CU-USU-01 -->
  <line x1="900" y1="340" x2="505" y2="510" class="link-line" />
  <line x1="900" y1="360" x2="775" y2="620" class="link-line" />
  <line x1="900" y1="330" x2="505" y2="155" class="link-line" />

  <!-- RELACIONES INCLUDE / EXTEND -->
  <!-- Modificar -> Activar/Inactivar (extend) -->
  <line x1="505" y1="280" x2="600" y2="240" class="dashed-line" marker-end="url(#arrow-gold)" />
  <text x="560" y="250" class="relation-label">&lt;&lt;extend&gt;&gt;</text>

  <!-- CU-02 Registrar -> Autenticar (include) -->
  <line x1="390" y1="198" x2="390" y2="172" class="dashed-line-pink" marker-end="url(#arrow-pink)" />
  <text x="430" y="190" class="relation-label-pink">&lt;&lt;include&gt;&gt;</text>

  <!-- Reasignar -> Inhabilitar por mantenimiento (extend) -->
  <line x1="500" y1="570" x2="605" y2="530" class="dashed-line" marker-end="url(#arrow-gold)" />
  <text x="565" y="545" class="relation-label">&lt;&lt;extend&gt;&gt;</text>

  <!-- Reasignar -> Monitorear ocupación (include) -->
  <line x1="390" y1="558" x2="390" y2="532" class="dashed-line-pink" marker-end="url(#arrow-pink)" />
  <text x="430" y="550" class="relation-label-pink">&lt;&lt;include&gt;&gt;</text>

</svg>