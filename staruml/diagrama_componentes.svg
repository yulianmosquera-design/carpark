<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .main-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #60a5fa; text-anchor: middle; }
      .main-subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      
      .package-box { fill: #1e293b; stroke: #334155; stroke-width: 1.8; rx: 8; }
      .package-tab { fill: #334155; rx: 4; }
      .package-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #f8fafc; }
      
      .component-box { fill: #0f172a; stroke: #38bdf8; stroke-width: 1.8; rx: 6; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
      .component-box-db { fill: #1e1b4b; stroke: #818cf8; stroke-width: 1.8; rx: 6; }
      .component-tab { fill: #38bdf8; rx: 2; }
      .component-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .component-detail { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9.5px; fill: #94a3b8; text-anchor: middle; }

      .interface-circle { fill: #ffffff; stroke: #38bdf8; stroke-width: 2; }
      .interface-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9.5px; font-weight: 600; fill: #38bdf8; }
      
      .connector-line { stroke: #38bdf8; stroke-width: 1.6; }
      .dep-line { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 4,3; }
    </style>
    <marker id="dep-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <text x="550" y="32" class="main-title">Diagrama de Componentes del Sistema: Parqueadero Autos Colombia</text>
  <text x="550" y="52" class="main-subtitle">Arquitectura de Componentes de Software Integrada (Iteraciones 1 y 2 - StarUML)</text>

  <!-- CAPA 1: CLIENTE / PRESENTACIÓN -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="130" height="22" class="package-tab" />
    <text x="10" y="16" class="package-title">Capa Presentación</text>
    <rect x="0" y="20" width="1040" height="150" class="package-box" />

    <!-- Componente 1: Web Browser UI -->
    <g transform="translate(30, 45)">
      <rect x="0" y="0" width="280" height="95" class="component-box" />
      <rect x="-8" y="15" width="16" height="12" class="component-tab" />
      <rect x="-8" y="45" width="16" height="12" class="component-tab" />
      <text x="140" y="35" class="component-title">&lt;&lt;component&gt;&gt;</text>
      <text x="140" y="55" class="component-title">SPA Dashboard UI</text>
      <text x="140" y="75" class="component-detail">HTML5, CSS3 CarPark Dark Theme, app.js</text>
    </g>

    <!-- Componente 2: Módulo Ticket Térmico -->
    <g transform="translate(380, 45)">
      <rect x="0" y="0" width="280" height="95" class="component-box" />
      <rect x="-8" y="15" width="16" height="12" class="component-tab" />
      <rect x="-8" y="45" width="16" height="12" class="component-tab" />
      <text x="140" y="35" class="component-title">&lt;&lt;component&gt;&gt;</text>
      <text x="140" y="55" class="component-title">Ticket &amp; Liquidación Manager</text>
      <text x="140" y="75" class="component-detail">Impresión Térmica, Modal de Cobro</text>
    </g>

    <!-- Componente 3: Módulo Celdas & Usuarios UI -->
    <g transform="translate(730, 45)">
      <rect x="0" y="0" width="280" height="95" class="component-box" />
      <rect x="-8" y="15" width="16" height="12" class="component-tab" />
      <rect x="-8" y="45" width="16" height="12" class="component-tab" />
      <text x="140" y="35" class="component-title">&lt;&lt;component&gt;&gt;</text>
      <text x="140" y="55" class="component-title">CellMap &amp; UserMgmt UI</text>
      <text x="140" y="75" class="component-detail">Mapa Visual, Reasignación y CRUD Operadores</text>
    </g>
  </g>

  <!-- INTERFAZ HTTP / REST API GATEWAY -->
  <circle cx="550" cy="270" r="10" class="interface-circle" />
  <text x="570" y="274" class="interface-text">REST / JSON HTTP API Interface</text>
  <line x1="550" y1="230" x2="550" y2="260" class="connector-line" />
  <line x1="550" y1="280" x2="550" y2="310" class="connector-line" />

  <!-- CAPA 2: APLICACIÓN / BACKEND (NODE.JS + EXPRESS) -->
  <g transform="translate(30, 310)">
    <rect x="0" y="0" width="160" height="22" class="package-tab" />
    <text x="10" y="16" class="package-title">Capa Lógica de Negocio</text>
    <rect x="0" y="20" width="1040" height="240" class="package-box" />

    <!-- Componente 4: API Controller -->
    <g transform="translate(30, 45)">
      <rect x="0" y="0" width="280" height="85" class="component-box" />
      <rect x="-8" y="15" width="16" height="12" class="component-tab" />
      <rect x="-8" y="45" width="16" height="12" class="component-tab" />
      <text x="140" y="30" class="component-title">&lt;&lt;component&gt;&gt;</text>
      <text x="140" y="50" class="component-title">ParqueaderoController</text>
      <text x="140" y="70" class="component-detail">Routing HTTP, Validaciones de Entrada</text>
    </g>

    <!-- Componente 5: ParqueaderoService (Iteración 1) -->
    <g transform="translate(380, 45)">
      <rect x="0" y="0" width="280" height="85" class="component-box" />
      <rect x="-8" y="15" width="16" height="12" class="component-tab" />
      <rect x="-8" y="45" width="16" height="12" class="component-tab" />
      <text x="140" y="30" class="component-title">&lt;&lt;component&gt;&gt;</text>
      <text x="140" y="50" class="component-title">ParqueaderoService</text>
      <text x="140" y="70" class="component-detail">Reglas de Negocio, Tarifas, Mensualidades</text>
    </g>

    <!-- Componente 6: User & Cell Service (Iteración 2) -->
    <g transform="translate(730, 45)">
      <rect x="0" y="0" width="280" height="85" class="component-box" />
      <rect x="-8" y="15" width="16" height="12" class="component-tab" />
      <rect x="-8" y="45" width="16" height="12" class="component-tab" />
      <text x="140" y="30" class="component-title">&lt;&lt;component&gt;&gt;</text>
      <text x="140" y="50" class="component-title">User &amp; Cell Manager Service</text>
      <text x="140" y="70" class="component-detail">Gestión de Celdas, Reasignación, Roles</text>
    </g>

    <!-- Componente 7: Data Access Repository -->
    <g transform="translate(380, 155)">
      <rect x="0" y="0" width="280" height="85" class="component-box" />
      <rect x="-8" y="15" width="16" height="12" class="component-tab" />
      <rect x="-8" y="45" width="16" height="12" class="component-tab" />
      <text x="140" y="30" class="component-title">&lt;&lt;component&gt;&gt;</text>
      <text x="140" y="50" class="component-title">ParqueaderoRepository</text>
      <text x="140" y="70" class="component-detail">Prepared Statements, Sentencias SQL ACID</text>
    </g>

    <!-- Conexiones internas -->
    <line x1="310" y1="87" x2="380" y2="87" class="dep-line" marker-end="url(#dep-arrow)" />
    <line x1="660" y1="87" x2="730" y2="87" class="dep-line" marker-end="url(#dep-arrow)" />
    <line x1="520" y1="130" x2="520" y2="155" class="dep-line" marker-end="url(#dep-arrow)" />
    <line x1="870" y1="130" x2="660" y2="180" class="dep-line" marker-end="url(#dep-arrow)" />
  </g>

  <!-- INTERFAZ SQLITE DRIVER -->
  <circle cx="550" cy="590" r="10" class="interface-circle" style="stroke: #818cf8;" />
  <text x="570" y="594" class="interface-text" style="fill: #818cf8;">Native SQLite / Node C++ Addon Interface</text>
  <line x1="550" y1="550" x2="550" y2="580" class="connector-line" style="stroke: #818cf8;" />
  <line x1="550" y1="600" x2="550" y2="630" class="connector-line" style="stroke: #818cf8;" />

  <!-- CAPA 3: PERSISTENCIA Y BASE DE DATOS -->
  <g transform="translate(30, 630)">
    <rect x="0" y="0" width="140" height="22" class="package-tab" />
    <text x="10" y="16" class="package-title">Capa Persistencia</text>
    <rect x="0" y="20" width="1040" height="110" class="package-box" />

    <!-- Componente 8: autos_colombia.db -->
    <g transform="translate(230, 35)">
      <rect x="0" y="0" width="640" height="75" class="component-box-db" />
      <rect x="-8" y="15" width="16" height="12" class="component-tab" style="fill: #818cf8;" />
      <rect x="-8" y="45" width="16" height="12" class="component-tab" style="fill: #818cf8;" />
      <text x="320" y="28" class="component-title">&lt;&lt;database engine&gt;&gt; SQLite3 3FN</text>
      <text x="320" y="46" class="component-title">autos_colombia.db</text>
      <text x="320" y="64" class="componentdetail" style="fill: #a5b4fc; font-size: 9.5px; text-anchor: middle;">Tablas: usuarios, roles, celdas, vehiculos, mensualidades, registros_estadia, novedades, pagos</text>
    </g>
  </g>

</svg>